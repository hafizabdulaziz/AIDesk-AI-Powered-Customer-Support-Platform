[project]
name = "ai-customer-support-backend"
version = "0.1.0"
description = "Backend services for the AI Customer Support Platform"
authors = [
    { name = "Hafiz Abdul Aziz", email = "abdulazizmemon888@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "langchain",
    "langchain-openai",
    "chromadb",
    "openai",
    "email-validator",
    "jinja2",
    "pypdf2",
    "python-multipart",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend/src"}
packages = ["api", "core", "models", "services"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
]

[tool.ruff]

[tool.vercel]
entrypoint = "backend.api.index:app"
