{% extends "base.html" %}

{% block title %}Ticket Detail - AIDesk{% endblock %}

{% block content %}
<div class="p-6 max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <a href="/chat" class="flex items-center text-sm text-blue-600 hover:text-blue-800 transition-colors">
            <i class="fas fa-arrow-left mr-2"></i> Back to Chat
        </a>
        <div class="flex gap-2">
            <button id="escalate-btn" class="px-4 py-2 text-sm font-medium bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i class="fas fa-exclamation-triangle mr-2 text-yellow-500"></i> Escalate
            </button>
            <button id="resolve-btn" class="px-4 py-2 text-sm font-medium bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors shadow-sm">
                <i class="fas fa-check mr-2"></i> Mark Resolved
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Ticket Info Sidebar -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Ticket Information</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase">Subject</label>
                        <p id="detail-subject" class="text-sm font-medium text-gray-800">Loading...</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase">Status</label>
                        <div class="flex items-center gap-2 mt-1">
                            <span id="detail-status" class="px-2 py-1 text-xs font-bold rounded-full bg-green-100 text-green-700">Open</span>
                            <select id="status-updater" class="text-xs p-1 border border-gray-200 rounded bg-gray-50 focus:outline-none">
                                <option value="OPEN">Open</option>
                                <option value="PENDING_HUMAN">Pending Human</option>
                                <option value="AI_RESOLVED">AI Resolved</option>
                                <option value="CLOSED">Closed</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase">Priority</label>
                        <p id="detail-priority" class="text-sm font-medium text-gray-800">Loading...</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase">Category</label>
                        <p id="detail-category" class="text-sm font-medium text-gray-800">Loading...</p>
                    </div>
                    <div class="pt-4 border-t border-gray-100">
                        <label class="block text-xs font-semibold text-gray-400 uppercase">Created At</label>
                        <p id="detail-created" class="text-xs text-gray-500">Loading...</p>
                    </div>
                </div>
            </div>

            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                <h4 class="text-sm font-bold text-blue-800 mb-2">Agent Note</h4>
                <textarea id="agent-note" class="w-full p-3 text-sm border border-blue-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" rows="3" placeholder="Add a private note..."></textarea>
                <button class="mt-2 w-full py-2 text-xs font-bold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Note</button>
            </div>
        </div>

        <!-- Conversation History -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-[70vh]">
                <div class="p-4 border-b border-gray-100 font-semibold text-gray-700">
                    Conversation History
                </div>
                <div id="history-container" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50">
                    <!-- Messages loaded via JS -->
                    <div class="text-center text-gray-400 italic py-10">Loading conversation...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #history-container::-webkit-scrollbar { width: 6px; }
    #history-container::-webkit-scrollbar-track { background: transparent; }
    #history-container::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
</style>

<script>
    const API_BASE_URL = 'http://localhost:8001/api/v1';
    const params = new URLSearchParams(window.location.search);
    const ticketId = params.get('ticket_id');

    async function loadTicketDetail() {
        if (!ticketId) {
            alert('No ticket ID provided');
            window.location.href = '/chat';
            return;
        }

        try {
            // 1. Load History
            const histResponse = await fetch(`${API_BASE_URL}/agent/tickets/${ticketId}/history`);
            if (!histResponse.ok) throw new Error('Failed to fetch history');
            const messages = await histResponse.json();
            
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const isUser = msg.sender === 'USER' || msg.sender === 1;
                const wrapper = document.createElement('div');
                wrapper.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`;
                
                const bubble = document.createElement('div');
                bubble.className = `max-w-[80%] p-3 rounded-2xl shadow-sm ${
                    isUser ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-gray-200 text-gray-800 rounded-tl-none'
                }`;
                bubble.textContent = msg.content;
                
                wrapper.appendChild(bubble);
                container.appendChild(wrapper);
            });

            // 2. Mock Detail Info (Since we don't have a specific /ticket/{id} endpoint)
            document.getElementById('detail-subject').textContent = 'Customer Inquiry about Billing';
            document.getElementById('detail-priority').textContent = 'Medium';
            document.getElementById('detail-category').textContent = 'Billing';
            document.getElementById('detail-created').textContent = new Date().toLocaleString();

        } catch (error) {
            console.error('Error loading details:', error);
            document.getElementById('history-container').innerHTML = '<div class="text-center text-red-500 py-10">Error loading ticket details.</div>';
        }
    }

    async function resolveTicket() {
        try {
            const response = await fetch(`${API_BASE_URL}/agent/tickets/${ticketId}/resolve`, { method: 'POST' });
            if (!response.ok) throw new Error('Failed to resolve');
            alert('Ticket marked as resolved!');
            window.location.href = '/dashboard';
        } catch (error) {
            alert('Error resolving ticket');
        }
    }

    document.getElementById('resolve-btn').onclick = resolveTicket;
    document.addEventListener('DOMContentLoaded', loadTicketDetail);
</script>
{% endblock %}
