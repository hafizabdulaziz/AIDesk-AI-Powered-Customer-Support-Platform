<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIDesk - AI Customer Support Platform{% endblock %}</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <!-- Navigation Bar -->
    <nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0">
        <div class="px-3 py-3 lg:px-5 lg:pl-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center justify-start">
                    <a href="/" class="flex items-center">
                        <span class="text-2xl font-bold text-blue-600 mr-2"><i class="fas fa-robot"></i> AIDesk</span>
                    </a>
                    <div class="hidden md:flex space-x-4 ml-10">
                        <a href="/chat" class="flex items-center p-2 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-100 hover:text-blue-600 transition-colors">
                            <i class="fas fa-comments mr-2"></i> Chat
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button type="button" class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300">
                        <span class="sr-only">Open user menu</span>
                        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">A</div>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <div class="pt-16">
        {% block content %}{% endblock %}
    </div>

    <!-- Global Scripts -->
    <script src="/static/js/chat.js"></script>
</body>
</html>
