{% extends "base.html" %}

{% block title %}Chat - AIDesk{% endblock %}

{% block content %}
<div class="flex h-[calc(100vh-64px)] overflow-hidden">
    <!-- Left Sidebar: Ticket List -->
    <aside class="w-64 bg-gray-100 border-r border-gray-200 flex flex-col">
        <div class="p-4 border-b border-gray-200">
            <button id="newTicketBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition" onclick="document.getElementById('newTicketModal').classList.remove('hidden')">
                <i class="fas fa-plus mr-2"></i> New Ticket
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="ticketList">
            <!-- Ticket items will be injected here -->
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-white">
        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chatMessages">
            <!-- Messages will be injected here -->
        </div>
        
        <!-- Input Box -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex gap-2">
                <input type="text" id="messageInput" class="flex-1 border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type your message...">
                <button id="sendBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>
</div>

<!-- New Ticket Modal -->
<div id="newTicketModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg w-96">
        <h2 class="text-xl font-bold mb-4">Create New Ticket</h2>
        <input type="text" id="ticketSubject" class="w-full border rounded p-2 mb-2" placeholder="Subject">
        <select id="ticketCategory" class="w-full border rounded p-2 mb-2">
            <option value="General">General</option>
            <option value="Technical">Technical</option>
            <option value="Billing">Billing</option>
        </select>
        <textarea id="ticketDescription" class="w-full border rounded p-2 mb-4" placeholder="Description"></textarea>
        <div class="flex justify-end gap-2">
            <button onclick="document.getElementById('newTicketModal').classList.add('hidden')" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
            <button onclick="createTicket()" class="px-4 py-2 bg-blue-600 text-white rounded">Submit</button>
        </div>
    </div>
</div>

<script>
    function createTicket() {
        // Ticket creation API logic will go here
        alert('Ticket created!');
        document.getElementById('newTicketModal').classList.add('hidden');
    }
</script>
{% endblock %}
